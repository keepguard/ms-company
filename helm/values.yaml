image:
  repository: ghcr.io/keepguard/ms-company
  tag: "1.0.9-1.0.0"
  pullPolicy: IfNotPresent

service:
  port: 8083

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 256Mi

env:
  springProfilesActive: local
  serverPort: 8083
  redisHost: "redis"
  redisPort: 6379
  rabbitmqHost: "rabbitmq-service"
  rabbitmqPort: "5672"
  userServiceUrl: "http://ms-user:8085"
  authServiceUrl: "http://ms-auth:8081"
  postgresDb: "keepguard_api_db"
  postgresUser: "keepguard_api_user"

imagePullSecrets:
  - name: ghcr-secret
