server:
  port: 8083
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/keepguard_api_db
    username: keepguard_api_user
    password: keepguard_api_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  data:
    redis:
      cluster:
        nodes: redis-node-1:7000,redis-node-2:7001,redis-node-3:7002,redis-node-4:7003,redis-node-5:7004,redis-node-6:7005
        max-redirects: 3
      password: ""
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
        cluster:
          refresh:
            adaptive: true
            period: 30s
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: ms_company

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
        
# Configurações de Cache (TTL em segundos)
cache:
  redis:
    ttl:
      company: 2592000     # 30 dias
      address: 2592000     # 30 dias
      bank-account: 2592000 # 30 dias
      contact: 2592000     # 30 dias
      representative: 2592000 # 30 dias
    prefix:
      company: "company_cache"
      address: "address_cache"
      bank-account: "bank_account_cache"
      contact: "contact_cache"
      representative: "representative_cache"

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

logging:
  port: 5000
  enabled: true
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN
    com.keepguard.ms_company: INFO
