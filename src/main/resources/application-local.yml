server:
  port: 8583
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/keepguard_api_db
    username: keepguard_api_user
    password: keepguard_api_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: ms_company

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
        
# Configurações de Cache (TTL em segundos)
cache:
  redis:
    ttl:
      company: 2592000     # 30 dias
      address: 2592000     # 30 dias
      bank-account: 2592000 # 30 dias
      contact: 2592000     # 30 dias
      representative: 2592000 # 30 dias
    prefix:
      company: "company_cache:"
      address: "address_cache:"
      bank-account: "bank_account_cache:"
      contact: "contact_cache:"
      representative: "representative_cache:"

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
