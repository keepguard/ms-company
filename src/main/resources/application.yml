server:
  port: 8083
spring:
  threads:
    virtual:
      enabled: true
  cloud:
    compatibility-verifier:
      enabled: false
  profiles:
    active: local
  application:
    name: ms-company
  datasource:
    url: jdbc:postgresql://postgres:5432/keepguard_api_db
    username: keepguard_api_user
    password: keepguard_api_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:${RABBITMQ_DEFAULT_USER:guest}}
    password: ${RABBITMQ_PASSWORD:${RABBITMQ_DEFAULT_PASS:guest}}
  data:
    redis:
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: ms_company
  jackson:
    serialization:
      INDENT_OUTPUT: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Configurações de Cache (TTL em segundos)
cache:
  redis:
    ttl:
      company: 2592000     # 30 dias
      address: 2592000     # 30 dias
      bank-account: 2592000 # 30 dias
      contact: 2592000     # 30 dias
      representative: 2592000 # 30 dias
    prefix:
      company: "company_cache"
      address: "address_cache"
      bank-account: "bank_account_cache"
      contact: "contact_cache"
      representative: "representative_cache"

logging:
  level:
    root: INFO
    org.springframework: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallDurationThreshold: 5000ms
        slowCallRateThreshold: 50
    instances:
      redisCache:
        baseConfig: default
        registerHealthIndicator: true
        
  retry:
    configs:
      default:
        maxAttempts: 2
        waitDuration: 1s
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.sql.SQLException
          - org.springframework.dao.DataAccessException
          - org.springframework.data.redis.RedisConnectionFailureException
    instances:
      redisCache:
        baseConfig: default
      databaseOperation:
        baseConfig: default
        
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 50
        maxWaitDuration: 0ms
    instances:
      databaseOperation:
        baseConfig: default

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

keepguard:
  audit:
    enabled: true
    exchange: ${KEEPGUARD_AUDIT_EXCHANGE:srv-audit-exchange-local}
    routing-key: audit.event
    source-service: ms-company

